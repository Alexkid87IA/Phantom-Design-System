<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>H8 — Duo-tone, split bold/light</title>
<link rel="stylesheet" href="colors_and_type.css">
<style>
body{margin:0;background:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
.label{position:fixed;top:16px;left:16px;font-family:var(--font-mono);font-size:11px;color:var(--phantom-violet-200);letter-spacing:0.1em;text-transform:uppercase}
.hero-text{text-align:center;max-width:860px;padding:0 40px}
h1{margin:0;line-height:1.05}
.l1{display:block;font-family:var(--font-display);font-size:clamp(40px,5.5vw,68px);font-weight:300;letter-spacing:-0.02em;color:rgba(255,255,255,0.6)}
.l2{display:block;font-family:var(--font-display);font-size:clamp(40px,5.5vw,68px);font-weight:300;letter-spacing:-0.02em;color:rgba(255,255,255,0.6)}
.l2 strong{font-weight:800;color:#fff}
.l3{display:block;font-family:var(--font-display);font-size:clamp(52px,7vw,90px);font-weight:800;letter-spacing:-0.04em;background:linear-gradient(91deg,var(--rainbow-yellow),var(--rainbow-orange),var(--rainbow-pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-top:4px}
.sub{font-family:var(--font-body);font-size:17px;color:rgba(255,255,255,0.4);margin-top:28px;line-height:1.65}
.sub strong{color:#fff;font-weight:600}
.ctas{margin-top:36px;display:flex;gap:14px;justify-content:center}
.btn-p{font-family:var(--font-body);font-weight:600;font-size:15px;padding:14px 28px;border-radius:9999px;background:#fff;color:var(--phantom-violet);border:2.5px solid #fff;box-shadow:4px 4px 0 0 var(--phantom-violet);text-decoration:none;transition:transform .15s,box-shadow .15s}
.btn-p:hover{transform:translate(-3px,-3px);box-shadow:7px 7px 0 0 var(--phantom-violet)}
.btn-g{font-family:var(--font-body);font-weight:600;font-size:15px;padding:14px 28px;border-radius:9999px;background:transparent;color:#fff;border:2.5px solid #fff;box-shadow:4px 4px 0 0 rgba(255,255,255,.15);text-decoration:none;transition:transform .15s,box-shadow .15s}
.btn-g:hover{transform:translate(-3px,-3px);box-shadow:7px 7px 0 0 rgba(255,255,255,.2)}
</style></head><body>
<div class="label">8 / Duo-tone light/bold + gradient rainbow</div>
<div class="hero-text">
  <h1>
    <span class="l1">T'as pas besoin</span>
    <span class="l2">d'une <strong>&eacute;quipe.</strong></span>
    <span class="l3">T'as besoin que &ccedil;a tourne.</span>
  </h1>
  <p class="sub">Phantom installe des <strong>agents IA autonomes</strong> dans ta bo&icirc;te. Ils g&egrave;rent, ex&eacute;cutent, relancent &mdash; sans toi.</p>
  <div class="ctas"><a href="#" class="btn-p">R&eacute;server un appel &rarr;</a><a href="#" class="btn-g">Comment &ccedil;a marche</a></div>
</div>
</body></html>
