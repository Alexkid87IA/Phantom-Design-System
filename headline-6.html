<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>H6 — Stacked, payoff pleine largeur</title>
<link rel="stylesheet" href="colors_and_type.css">
<style>
body{margin:0;background:var(--ink);display:flex;flex-direction:column;justify-content:center;min-height:100vh;overflow:hidden;padding:0 48px}
.label{position:fixed;top:16px;left:16px;font-family:var(--font-mono);font-size:11px;color:var(--phantom-violet-200);letter-spacing:0.1em;text-transform:uppercase}
.row-top{display:flex;align-items:baseline;gap:20px;margin-bottom:4px}
.setup{font-family:var(--font-display);font-size:clamp(24px,3vw,38px);font-weight:600;color:rgba(255,255,255,0.5);letter-spacing:-0.02em;white-space:nowrap}
.line{flex:1;height:2px;background:linear-gradient(90deg,rgba(255,255,255,0.1),transparent);margin-top:8px}
.payoff{font-family:var(--font-display);font-size:clamp(80px,12vw,180px);font-weight:700;letter-spacing:-0.06em;line-height:0.85;margin:0;background:linear-gradient(91deg,var(--rainbow-yellow),#fff 60%,var(--rainbow-yellow));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.bottom-row{display:flex;align-items:center;gap:32px;margin-top:36px}
.sub{font-family:var(--font-body);font-size:16px;color:rgba(255,255,255,0.4);line-height:1.6;max-width:400px;flex-shrink:0}
.sub strong{color:#fff;font-weight:600}
.ctas{display:flex;gap:14px}
.btn-p{font-family:var(--font-body);font-weight:600;font-size:15px;padding:14px 28px;border-radius:9999px;background:#fff;color:var(--phantom-violet);border:2.5px solid #fff;box-shadow:4px 4px 0 0 var(--phantom-violet);text-decoration:none;transition:transform .15s,box-shadow .15s;white-space:nowrap}
.btn-p:hover{transform:translate(-3px,-3px);box-shadow:7px 7px 0 0 var(--phantom-violet)}
.btn-g{font-family:var(--font-body);font-weight:600;font-size:15px;padding:14px 28px;border-radius:9999px;background:transparent;color:#fff;border:2.5px solid #fff;box-shadow:4px 4px 0 0 rgba(255,255,255,.15);text-decoration:none;transition:transform .15s,box-shadow .15s;white-space:nowrap}
.btn-g:hover{transform:translate(-3px,-3px);box-shadow:7px 7px 0 0 rgba(255,255,255,.2)}
</style></head><body>
<div class="label">6 / Payoff pleine largeur + ligne</div>
<div class="row-top">
  <span class="setup">T'as pas besoin d'une &eacute;quipe. T'as besoin que</span>
  <span class="line"></span>
</div>
<h1 class="payoff">&ccedil;a tourne.</h1>
<div class="bottom-row">
  <p class="sub">Phantom installe des <strong>agents IA autonomes</strong> dans ta bo&icirc;te. Ils g&egrave;rent, ex&eacute;cutent, relancent &mdash; sans toi.</p>
  <div class="ctas"><a href="#" class="btn-p">R&eacute;server un appel &rarr;</a><a href="#" class="btn-g">D&eacute;couvrir</a></div>
</div>
</body></html>
