<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>H2 — Split gauche, payoff gigantesque</title>
<link rel="stylesheet" href="colors_and_type.css">
<style>
body{margin:0;background:var(--ink);display:flex;align-items:center;min-height:100vh;overflow:hidden;padding:0 64px}
.label{position:fixed;top:16px;left:16px;font-family:var(--font-mono);font-size:11px;color:var(--phantom-violet-200);letter-spacing:0.1em;text-transform:uppercase}
.hero-text{max-width:720px}
.tag{display:inline-flex;align-items:center;gap:8px;background:rgba(110,60,255,0.1);border:1px solid rgba(110,60,255,0.25);border-radius:9999px;padding:6px 16px 6px 10px;margin-bottom:32px}
.tag-dot{width:7px;height:7px;border-radius:50%;background:var(--rainbow-green);box-shadow:0 0 8px rgba(0,210,106,.5)}
.tag-text{font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--phantom-violet-200)}
.setup{font-family:var(--font-body);font-size:22px;font-weight:400;color:rgba(255,255,255,0.55);line-height:1.5;margin:0 0 4px}
.payoff{font-family:var(--font-display);font-size:clamp(72px,10vw,140px);font-weight:700;letter-spacing:-0.05em;line-height:0.9;margin:0;color:var(--rainbow-yellow)}
.sub{font-family:var(--font-body);font-size:16px;color:rgba(255,255,255,0.4);margin-top:32px;line-height:1.7;max-width:420px}
.sub strong{color:#fff;font-weight:600}
.ctas{margin-top:32px;display:flex;gap:14px}
.btn-p{font-family:var(--font-body);font-weight:600;font-size:15px;padding:14px 28px;border-radius:9999px;background:#fff;color:var(--phantom-violet);border:2.5px solid #fff;box-shadow:4px 4px 0 0 var(--phantom-violet);text-decoration:none;transition:transform .15s,box-shadow .15s}
.btn-p:hover{transform:translate(-3px,-3px);box-shadow:7px 7px 0 0 var(--phantom-violet)}
.btn-g{font-family:var(--font-body);font-weight:600;font-size:15px;padding:14px 28px;border-radius:9999px;background:transparent;color:#fff;border:2.5px solid #fff;box-shadow:4px 4px 0 0 rgba(255,255,255,.15);text-decoration:none;transition:transform .15s,box-shadow .15s}
.btn-g:hover{transform:translate(-3px,-3px);box-shadow:7px 7px 0 0 rgba(255,255,255,.2)}
</style></head><body>
<div class="label">2 / Split gauche, payoff massif</div>
<div class="hero-text">
  <div class="tag"><span class="tag-dot"></span><span class="tag-text">Agents IA autonomes</span></div>
  <p class="setup">T'as pas besoin d'une &eacute;quipe. T'as besoin que</p>
  <h1 class="payoff">&ccedil;a tourne.</h1>
  <p class="sub">Phantom installe des <strong>agents IA autonomes</strong> dans ta bo&icirc;te. Ils g&egrave;rent, ex&eacute;cutent, relancent &mdash; sans toi.</p>
  <div class="ctas"><a href="#" class="btn-p">R&eacute;server un appel &rarr;</a><a href="#" class="btn-g">Comment &ccedil;a marche</a></div>
</div>
</body></html>
