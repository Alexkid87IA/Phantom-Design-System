<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="_base.css">
<style>
.card{padding:24px;gap:14px;align-items:stretch}
.field{display:flex;flex-direction:column;gap:6px}
.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-60)}
.in{font-family:var(--font-body);font-size:15px;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:#fff;color:var(--ink);transition:all .18s cubic-bezier(.2,.8,.2,1);box-shadow:0 1px 0 0 rgba(10,10,10,.04)}
.in:focus{outline:none;border-color:#6E3CFF;box-shadow:0 0 0 4px rgba(110,60,255,.18)}
.in::placeholder{color:var(--ink-30)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
</style></head><body>
<div class="card">
  <div class="row">
    <div class="field"><span class="lbl">Nom de l'agent</span><input class="in" value="Social Manager"></div>
    <div class="field"><span class="lbl">Email — focus</span><input class="in" value="hello@phantom.fr" style="border-color:#6E3CFF;box-shadow:0 0 0 4px rgba(110,60,255,.18)"></div>
  </div>
  <div class="field"><span class="lbl">Description</span><input class="in" placeholder="Dis-moi ce que tu veux automatiser…"></div>
</div>
</body></html>
