<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.card{padding:28px 24px;align-items:flex-start;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{font-family:var(--font-body);font-weight:500;font-size:14px;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;line-height:1;padding:12px 18px;border-radius:9999px;letter-spacing:-0.01em;transition:all .22s cubic-bezier(.2,.8,.2,1)}
.btn.primary{background:#6E3CFF;color:#fff}
.btn.primary:hover{background:#5A26EB;box-shadow:0 0 0 4px rgba(110,60,255,.18)}
.btn.dark{background:#0A0A0A;color:#fff}
.btn.ghost{background:transparent;color:#0A0A0A;border:1.5px solid #0A0A0A}
.btn.subtle{background:#F2F2F2;color:#0A0A0A}
.btn.pop{background:#FFD400;color:#0A0A0A;border:2px solid #0A0A0A;box-shadow:4px 4px 0 0 #0A0A0A;border-radius:14px;padding:11px 18px}
.btn.sm{padding:8px 14px;font-size:13px}
.btn.lg{padding:16px 24px;font-size:16px}
</style></head><body>
<div class="card">
  <div class="row">
    <button class="btn primary">Lance ton agent</button>
    <button class="btn dark">Continue</button>
    <button class="btn ghost">Voir le détail</button>
    <button class="btn subtle">Plus tard</button>
  </div>
  <div class="row">
    <button class="btn sm primary">Petit</button>
    <button class="btn primary">Standard</button>
    <button class="btn lg primary">Large CTA</button>
  </div>
</div>
</body></html>
