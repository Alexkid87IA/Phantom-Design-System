<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="_base.css">
<style>
.card{padding:28px 24px;align-items:center;justify-content:center;background:linear-gradient(180deg,#F7F6F2,#fff)}
.row{display:flex;gap:24px;align-items:center}
.g{width:88px;height:88px}
.lbl{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-40);white-space:nowrap}
.wrap{position:relative}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.g{animation:float 2.4s ease-in-out infinite}
.g:nth-child(2){animation-delay:.3s}
.g:nth-child(3){animation-delay:.6s}
.g:nth-child(4){animation-delay:.9s}
.g:nth-child(5){animation-delay:1.2s}
.g:nth-child(6){animation-delay:1.5s}
.g:nth-child(7){animation-delay:1.8s}
</style></head><body>
<div class="card">
  <div class="row">

    <svg class="g" style="color:#FF8A1F" viewBox="0 0 200 200" fill="none"><path d="M 20 100 A 80 80 0 0 1 180 100 L 180 160 Q 160 182 140 160 Q 120 182 100 160 Q 80 182 60 160 Q 40 182 20 160 Z" fill="currentColor"/><ellipse cx="78" cy="92" rx="10" ry="15" fill="#0A0A0A"/><ellipse cx="122" cy="92" rx="10" ry="15" fill="#0A0A0A"/></svg>
