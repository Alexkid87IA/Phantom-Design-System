<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="_base.css">
<style>
.card{padding:28px 24px;align-items:flex-start;gap:16px;background:#F7F6F2}
.row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.btn{font-family:var(--font-body);font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:12px 20px;letter-spacing:-0.01em;border-radius:14px;border:2px solid #0A0A0A;transition:all .12s cubic-bezier(.2,.8,.2,1)}
.btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 0 #0A0A0A !important}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 0 #0A0A0A !important}
.yellow{background:#FFD400;color:#0A0A0A;box-shadow:4px 4px 0 0 #0A0A0A}
.pink{background:#FF2D87;color:#fff;box-shadow:4px 4px 0 0 #0A0A0A}
.green{background:#00D26A;color:#fff;box-shadow:4px 4px 0 0 #0A0A0A}
.violet{background:#6E3CFF;color:#fff;box-shadow:4px 4px 0 0 #0A0A0A}
</style></head><body>
<div class="card">
  <div class="row">
    <button class="btn yellow">On y va 👻</button>
    <button class="btn pink">Voir la démo</button>
    <button class="btn green">+47% d'engagement</button>
    <button class="btn violet">Crée mon agent</button>
  </div>
  <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-40)">Pop buttons — éditoriaux, marketing, événementiel</div>
</div>
</body></html>
