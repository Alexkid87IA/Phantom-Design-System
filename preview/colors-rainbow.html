<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="_base.css">
<style>
.rainbow{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;height:108px}
.s{border-radius:10px;display:flex;flex-direction:column;justify-content:space-between;padding:10px;color:#fff;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em}
.s b{font-weight:500;text-transform:uppercase}
.s i{font-style:normal;opacity:.9;font-size:10px}
.s.dark{color:#0A0A0A}
</style></head><body>
<div class="card">
  <div class="rainbow">
    <div class="s" style="background:#FF4D2E"><b>Red</b><i>FF4D2E</i></div>
    <div class="s" style="background:#FF8A1F"><b>Orange</b><i>FF8A1F</i></div>
    <div class="s dark" style="background:#FFD400"><b>Yellow</b><i>FFD400</i></div>
    <div class="s" style="background:#00D26A"><b>Green</b><i>00D26A</i></div>
    <div class="s" style="background:#0066FF"><b>Blue</b><i>0066FF</i></div>
    <div class="s" style="background:#FF2D87"><b>Pink</b><i>FF2D87</i></div>
  </div>
</div>
</body></html>
