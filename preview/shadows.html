<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="_base.css">
<style>
.card{padding:28px 24px;background:#F7F6F2}
.row{display:flex;gap:24px}
.t{background:#fff;border-radius:12px;width:120px;height:80px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-family:var(--font-mono);font-size:10px;letter-spacing:.05em;color:var(--ink-60)}
.flat{box-shadow:0 1px 0 0 rgba(10,10,10,.06)}
.soft{box-shadow:0 4px 20px -4px rgba(10,10,10,.10),0 1px 0 0 rgba(10,10,10,.04)}
.lift{box-shadow:0 12px 40px -12px rgba(10,10,10,.18),0 2px 0 0 rgba(10,10,10,.04)}
.pop{box-shadow:4px 4px 0 0 #0A0A0A;border:2px solid #0A0A0A}
.glow{box-shadow:0 0 0 4px rgba(110,60,255,.18),0 20px 60px -20px rgba(110,60,255,.45);background:#6E3CFF;color:#fff}
</style></head><body>
<div class="card">
  <div class="row">
    <div class="t flat">flat</div>
    <div class="t soft">soft</div>
    <div class="t lift">lift</div>
    <div class="t pop">pop</div>
    <div class="t glow">glow</div>
  </div>
</div>
</body></html>
