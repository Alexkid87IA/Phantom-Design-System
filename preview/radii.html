<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.card{padding:24px}
.row{display:flex;align-items:flex-end;gap:14px}
.t{background:#F2EDFF;border:1px solid var(--phantom-violet-200);width:72px;height:72px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;color:var(--phantom-violet-600)}
.t.full{border-radius:9999px}
</style></head><body>
<div class="card">
  <div class="row">
    <div class="t" style="border-radius:4px">xs · 4</div>

    <div class="t" style="border-radius:12px">md · 12</div>
    <div class="t" style="border-radius:20px">lg · 20</div>
    <div class="t" style="border-radius:28px">xl · 28</div>
    <div class="t" style="border-radius:40px">2xl · 40</div>
    <div class="t full">full</div>
  </div>
</div>
</body></html>
