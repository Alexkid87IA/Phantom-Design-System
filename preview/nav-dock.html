<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="_base.css">
<style>
.card{padding:30px 24px;justify-content:center;align-items:center;background:linear-gradient(180deg,#F7F6F2 0%,#fff 100%);min-height:180px}
.dock{display:inline-flex;align-items:center;gap:4px;padding:6px;border-radius:9999px;background:rgba(255,255,255,.86);backdrop-filter:blur(24px);box-shadow:0 8px 30px -8px rgba(10,10,10,.18),0 1px 0 0 rgba(10,10,10,.06);border:1px solid rgba(10,10,10,.06)}
.logo{width:32px;height:32px;border-radius:9999px;background:#fff;display:flex;align-items:center;justify-content:center;margin-right:4px;color:#6E3CFF}
.logo svg{width:22px;height:22px}
.item{padding:10px 16px;border-radius:9999px;font-family:var(--font-body);font-size:13px;font-weight:500;color:#0A0A0A;letter-spacing:-0.01em;cursor:pointer}
.item.active{background:#fff;box-shadow:0 1px 3px rgba(10,10,10,.1),inset 0 0 0 1px rgba(10,10,10,.06)}
</style></head><body>
<div class="card">
  <div class="dock">
    <span class="logo">
      <svg viewBox="0 0 200 200" fill="none"><path d="M 20 100 A 80 80 0 0 1 180 100 L 180 160 Q 160 182 140 160 Q 120 182 100 160 Q 80 182 60 160 Q 40 182 20 160 Z" fill="currentColor"/><ellipse cx="78" cy="92" rx="10" ry="15" fill="#0A0A0A"/><ellipse cx="122" cy="92" rx="10" ry="15" fill="#0A0A0A"/></svg>
    </span>
    <span class="item">Agents</span>
    <span class="item active">Travail</span>
    <span class="item">Équipe</span>
    <span class="item">Tarifs</span>
    <span class="item">Contact</span>
  </div>
</div>
</body></html>
