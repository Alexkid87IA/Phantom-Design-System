<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.card{padding:24px;gap:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.c{border-radius:16px;padding:18px;background:#fff;border:1px solid var(--border);box-shadow:0 4px 20px -4px rgba(10,10,10,.10),0 1px 0 0 rgba(10,10,10,.04)}
.c.pop{border:2px solid #0A0A0A;box-shadow:4px 4px 0 0 #0A0A0A;border-radius:18px;background:#F2EDFF}
.eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--phantom-violet);margin-bottom:6px}
.title{font-family:var(--font-display);font-weight:600;font-size:20px;letter-spacing:-0.02em;line-height:1.1;margin:0 0 4px 0}
.meta{font-family:var(--font-body);font-size:13px;color:var(--ink-60);line-height:1.4}
</style></head><body>
<div class="card">
  <div class="row">
    <div class="c">
      <div class="eyebrow">— Agent · social</div>
      <div class="title">Sushi Boy · Insta</div>
      <div class="meta">12 posts planifiés · +47% d'engagement ce mois</div>
    </div>
    <div class="c pop">
      <div class="eyebrow" style="color:#0A0A0A">— Cas client</div>
      <div class="title">Restaurant +3 mois</div>
      <div class="meta">"On a doublé nos commandes Uber Eats."</div>
    </div>
  </div>
</div>
</body></html>
