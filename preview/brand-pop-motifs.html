<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.card{padding:0;height:220px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;height:100%}
.cell{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.a{background:#6E3CFF;color:#fff}
.b{background:#FFD400;color:#0A0A0A;border-left:2px solid #0A0A0A;border-right:2px solid #0A0A0A}
.c{background:#FF2D87;color:#fff}
.cell .glyph{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:140px;letter-spacing:-6px;line-height:1}
.cell .num{position:absolute;left:10px;top:8px;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.cell .lbl{position:absolute;right:10px;bottom:8px;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;text-align:right}
</style></head><body>
<div class="card">
  <div class="grid">
    <div class="cell a"><span class="num">01</span><span class="glyph">P</span><span class="lbl">Phantom<br>violet</span></div>
    <div class="cell b">
      <svg style="width:90px;height:90px;color:#0A0A0A" viewBox="0 0 200 200" fill="none"><path d="M 20 100 A 80 80 0 0 1 180 100 L 180 160 Q 160 182 140 160 Q 120 182 100 160 Q 80 182 60 160 Q 40 182 20 160 Z" fill="currentColor"/><ellipse cx="78" cy="92" rx="10" ry="15" fill="#FFD400"/><ellipse cx="122" cy="92" rx="10" ry="15" fill="#FFD400"/></svg>
      <span class="num">02</span><span class="lbl">Mark inversé<br>jaune × noir</span></div>
    <div class="cell c"><span class="num">03</span><span class="glyph" style="font-size:160px">!</span><span class="lbl">Type pop<br>display</span></div>
  </div>
</div>
</body></html>
