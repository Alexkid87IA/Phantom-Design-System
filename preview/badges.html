<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
.card{padding:24px;gap:14px;align-items:flex-start}
.row{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:9999px;display:inline-flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:9999px;background:currentColor}
.v{background:#F2EDFF;color:#5A26EB}
.r{background:#FFE2DA;color:#DE2C0F}
.o{background:#FFEBD2;color:#DB6A00}
.y{background:#FFF3B0;color:#8A6F00}
.g{background:#CFF5E0;color:#00A050}
.b{background:#D6E4FF;color:#0049CC}
.p{background:#FFD4E5;color:#D6126A}
.k{background:#0A0A0A;color:#fff}
.k2{background:#fff;color:#0A0A0A;border:1.5px solid #0A0A0A}
</style></head><body>
<div class="card">
  <div class="row">
    <span class="tag v"><span class="dot"></span>Social media</span>
    <span class="tag r"><span class="dot"></span>Avis Google</span>
    <span class="tag o"><span class="dot"></span>Photos Uber Eats</span>
    <span class="tag y"><span class="dot"></span>Site web</span>
    <span class="tag g"><span class="dot"></span>SEO</span>
    <span class="tag b"><span class="dot"></span>Brand B2C</span>
    <span class="tag p"><span class="dot"></span>Newsletter</span>
  </div>
  <div class="row">
    <span class="tag k">PRO</span>
    <span class="tag k2">Nouveau</span>
    <span class="tag v">Agentique</span>
    <span class="tag g">Live</span>
  </div>
</div>
</body></html>
