<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Phantom — Dashboard</title>
<link rel="stylesheet" href="colors_and_type.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #F7F6F2; }

  .app {
    display: flex;
    background: #fff;
    height: 100vh;
    width: 100%;
  }

  /* ── Sidebar ── */
  .sidebar {
    width: 240px;
    background: #F7F6F2;
    border-right: 1px solid rgba(10,10,10,0.06);
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow-y: auto;
  }
  .ws {
    padding: 8px 10px;
    margin-bottom: 14px;
    border-radius: 10px;
    background: #fff;
    border: 1px solid rgba(10,10,10,0.06);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .ws-avatar {
    width: 30px; height: 30px; border-radius: 7px;
    background: #FFD400; border: 1.5px solid #0A0A0A;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 700; font-size: 13px;
  }
  .ws-name {
    font-family: var(--font-body); font-size: 12px; font-weight: 600; color: var(--ink);
  }
  .ws-sub {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em;
    color: var(--ink-30); margin-top: 1px;
  }

  .section-title {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--ink-30);
    padding: 4px 10px 6px; display: flex; justify-content: space-between; align-items: center;
  }
  .nav-item {
    padding: 7px 10px; border-radius: 7px;
    display: flex; align-items: center; gap: 8px;
    font-family: var(--font-body); font-size: 12px; color: var(--ink);
    cursor: pointer; transition: background 0.15s;
    user-select: none;
  }
  .nav-item:hover { background: rgba(10,10,10,0.04); }
  .nav-item.active {
    background: rgba(110,60,255,0.08); color: #5A26EB; font-weight: 500;
  }
  .nav-badge {
    background: #FF4D2E; color: #fff;
    font-family: var(--font-mono); font-size: 9px; font-weight: 600;
    padding: 1px 5px; border-radius: 9999px; margin-left: auto;
  }
  .agent-row {
    padding: 5px 8px; border-radius: 7px;
    display: flex; align-items: center; gap: 8px;
    font-family: var(--font-body); font-size: 11px; font-weight: 500; color: var(--ink);
    cursor: pointer; transition: background 0.15s;
    user-select: none;
  }
  .agent-row:hover { background: rgba(10,10,10,0.04); }
  .agent-row.active { background: rgba(110,60,255,0.08); }
  .agent-dot {
    width: 6px; height: 6px; border-radius: 9999px; margin-left: auto;
  }
  .agent-count {
    font-family: var(--font-mono); font-size: 9px; color: var(--ink-30); min-width: 12px; text-align: right;
  }
  .add-agent-btn {
    cursor: pointer; border: none; background: none; padding: 2px;
    display: flex; align-items: center; justify-content: center;
  }

  .support {
    background: var(--ink); color: #fff;
    padding: 12px; border-radius: 12px;
    margin-top: auto; margin-bottom: 10px;
    position: relative; overflow: hidden;
    cursor: pointer;
  }
  .support-title {
    font-family: var(--font-display); font-weight: 600; font-size: 12px; line-height: 1.2; max-width: 130px;
  }
  .support-btn {
    background: #fff; color: var(--ink); border: none; border-radius: 9999px;
    padding: 4px 10px; font-family: var(--font-body); font-size: 10px; font-weight: 600;
    margin-top: 8px; display: inline-block; cursor: pointer;
  }
  .user-block {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px;
  }
  .user-avatar {
    width: 24px; height: 24px; border-radius: 9999px; background: #FF2D87;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-family: var(--font-display); font-weight: 700; font-size: 9px;
  }
  .user-name { font-family: var(--font-body); font-size: 11px; font-weight: 500; color: var(--ink); }
  .user-email { font-family: var(--font-body); font-size: 9px; color: var(--ink-30); }

  /* ── Main ── */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-y: auto; }

  .topbar {
    height: 48px; border-bottom: 1px solid rgba(10,10,10,0.06);
    display: flex; align-items: center; padding: 0 20px; gap: 14px;
    background: rgba(255,255,255,0.86);
    backdrop-filter: blur(12px);
    position: sticky; top: 0; z-index: 10;
    flex-shrink: 0;
  }
  .breadcrumb {
    font-family: var(--font-body); font-size: 12px; color: var(--ink-60);
  }
  .breadcrumb strong { color: var(--ink); font-weight: 500; }
  .search-trigger {
    background: rgba(10,10,10,0.04); border: 1px solid transparent;
    border-radius: 9999px; padding: 5px 12px;
    font-family: var(--font-body); font-size: 11px; color: var(--ink-30);
    width: 240px; cursor: pointer; user-select: none;
    transition: background 0.15s;
  }
  .search-trigger:hover { background: rgba(10,10,10,0.07); }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .tag-green {
    background: var(--green-100); color: var(--green-600);
    font-family: var(--font-mono); font-size: 9px; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 4px 8px; border-radius: 9999px; display: flex; align-items: center; gap: 4px;
  }
  .tag-green::before { content:''; width:5px; height:5px; border-radius:9999px; background:currentColor; }
  .btn-dark {
    background: var(--ink); color: #fff; border: none;
    border-radius: 9999px; padding: 5px 14px;
    font-family: var(--font-body); font-size: 11px; font-weight: 600;
    cursor: pointer; transition: opacity 0.15s;
  }
  .btn-dark:hover { opacity: 0.85; }

  .content { padding: 24px 28px; display: flex; flex-direction: column; gap: 20px; flex: 1; }

  .welcome-date {
    font-family: var(--font-mono); font-size: 10px;
    letter-spacing: 0.16em; text-transform: uppercase; color: #5A26EB;
  }
  .welcome-title {
    font-family: var(--font-display); font-weight: 700;
    font-size: 32px; line-height: 1; letter-spacing: -0.03em;
    margin: 8px 0 0; color: var(--ink);
  }
  .welcome-title .muted { color: var(--ink-30); }
  .welcome-row {
    display: flex; justify-content: space-between; align-items: flex-end;
  }
  .welcome-actions { display: flex; gap: 8px; }
  .btn-outline {
    background: #fff; color: var(--ink); border: 1px solid rgba(10,10,10,0.12);
    border-radius: 9999px; padding: 6px 14px;
    font-family: var(--font-body); font-size: 11px; font-weight: 500;
    cursor: pointer; transition: background 0.15s;
  }
  .btn-outline:hover { background: rgba(10,10,10,0.03); }
  .btn-primary {
    background: var(--phantom-violet); color: #fff; border: none;
    border-radius: 9999px; padding: 6px 16px;
    font-family: var(--font-body); font-size: 11px; font-weight: 600;
    cursor: pointer; transition: opacity 0.15s;
  }
  .btn-primary:hover { opacity: 0.9; }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; }
  .stat {
    border-radius: 14px; padding: 18px; position: relative; overflow: hidden;
    cursor: default; transition: transform 0.15s var(--ease);
  }
  .stat:hover { transform: translateY(-2px); }
  .stat-label {
    font-family: var(--font-mono); font-size: 9px;
    letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.85;
  }
  .stat-val {
    font-family: var(--font-display); font-weight: 700;
    font-size: 36px; line-height: 1; letter-spacing: -0.04em;
    margin-top: 8px; font-variant-numeric: tabular-nums;
  }
  .stat-sub {
    font-family: var(--font-body); font-size: 11px; opacity: 0.85; margin-top: 6px;
  }

  /* Two column */
  .two-col {
    display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; align-items: start;
    flex: 1; min-height: 0;
  }

  .card {
    background: #fff; border-radius: 14px;
    box-shadow: 0 4px 16px -4px rgba(10,10,10,0.08), 0 1px 0 0 rgba(10,10,10,0.03);
    border: 1px solid rgba(10,10,10,0.06); overflow: hidden;
  }
  .card-header {
    padding: 14px 18px; border-bottom: 1px solid rgba(10,10,10,0.06);
    display: flex; justify-content: space-between; align-items: center;
  }
  .card-title { font-family: var(--font-body); font-weight: 600; font-size: 13px; color: var(--ink); }
  .card-sub { font-family: var(--font-body); font-size: 10px; color: var(--ink-30); margin-top: 1px; }

  .feed-item {
    padding: 12px 18px; display: flex; gap: 10px; align-items: flex-start;
    border-bottom: 1px solid rgba(10,10,10,0.04);
    cursor: pointer; transition: background 0.12s;
  }
  .feed-item:hover { background: rgba(10,10,10,0.015); }
  .feed-item:last-child { border-bottom: none; }
  .feed-time {
    font-family: var(--font-mono); font-size: 9px; color: var(--ink-30);
    width: 32px; flex-shrink: 0; padding-top: 4px;
  }
  .feed-text { font-family: var(--font-body); font-size: 12px; color: var(--ink); line-height: 1.4; flex: 1; }
  .feed-text strong { font-weight: 600; }
  .feed-text .sub { display: block; font-size: 10px; color: var(--ink-40); margin-top: 2px; }
  .feed-status {
    font-family: var(--font-mono); font-size: 8px; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 3px 6px; border-radius: 9999px; white-space: nowrap; flex-shrink: 0;
    cursor: pointer; transition: opacity 0.15s; user-select: none;
  }
  .feed-done { background: rgba(10,10,10,0.04); color: var(--ink-40); }
  .feed-waiting { background: #FFE580; color: #6B5800; }
  .feed-filter-tabs { display: flex; gap: 4px; }
  .feed-filter-tab {
    font-family: var(--font-mono); font-size: 8px; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 3px 6px; border-radius: 9999px; white-space: nowrap;
    cursor: pointer; transition: all 0.15s; user-select: none; border: none;
  }
  .feed-filter-tab.active-filter { background: var(--ink); color: #fff; }
  .feed-filter-tab:not(.active-filter) { background: rgba(10,10,10,0.04); color: var(--ink-40); }
  .feed-filter-tab:not(.active-filter):hover { background: rgba(10,10,10,0.08); }

  /* Feed validation actions */
  .feed-actions {
    display: flex; gap: 4px; flex-shrink: 0;
  }
  .feed-action-btn {
    font-family: var(--font-mono); font-size: 8px; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 9999px; border: none;
    cursor: pointer; transition: all 0.15s;
  }
  .feed-action-approve { background: var(--green-100); color: var(--green-600); }
  .feed-action-approve:hover { background: #00D26A; color: #fff; }
  .feed-action-dismiss { background: rgba(10,10,10,0.04); color: var(--ink-40); }
  .feed-action-dismiss:hover { background: rgba(10,10,10,0.08); }

  /* Composer */
  .messages { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; overflow-y: auto; }
  .msg {
    max-width: 82%; padding: 10px 14px; border-radius: 16px;
    font-family: var(--font-body); font-size: 12px; line-height: 1.45;
    animation: msgIn 0.25s var(--ease);
  }
  .msg-agent { background: #F2EDFF; color: var(--ink); align-self: flex-start; border-top-left-radius: 4px; }
  .msg-user { background: var(--ink); color: #fff; align-self: flex-end; border-top-right-radius: 4px; }

  .chips { padding: 0 16px 12px; display: flex; gap: 4px; flex-wrap: wrap; }
  .chip {
    background: rgba(10,10,10,0.04); border: none; border-radius: 9999px;
    padding: 5px 12px; font-family: var(--font-body); font-size: 10px; color: var(--ink);
    cursor: pointer; transition: background 0.15s;
  }
  .chip:hover { background: rgba(10,10,10,0.08); }
  .composer-input {
    padding: 12px 16px; border-top: 1px solid rgba(10,10,10,0.06);
    background: #F7F6F2; display: flex; align-items: center; gap: 8px;
  }
  .composer-field {
    flex: 1; background: #fff; border: 1px solid rgba(10,10,10,0.08);
    border-radius: 12px; padding: 8px 14px;
    font-family: var(--font-body); font-size: 11px; color: var(--ink);
    outline: none; transition: border-color 0.15s;
  }
  .composer-field:focus { border-color: var(--phantom-violet); }
  .composer-field::placeholder { color: var(--ink-30); }
  .send-btn {
    width: 28px; height: 28px; border-radius: 9999px;
    background: var(--phantom-violet); border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: opacity 0.15s; flex-shrink: 0;
  }
  .send-btn:hover { opacity: 0.85; }
  .send-btn:disabled { opacity: 0.4; cursor: default; }

  /* Typing indicator */
  .typing { display: flex; gap: 4px; align-items: center; padding: 10px 14px; align-self: flex-start; }
  .typing-dot {
    width: 6px; height: 6px; border-radius: 9999px; background: var(--ink-30);
    animation: typingBounce 1.2s ease-in-out infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.15s; }
  .typing-dot:nth-child(3) { animation-delay: 0.3s; }

  /* Agent chat view */
  .agent-chat-view { display: flex; flex-direction: column; height: 100%; }
  .agent-chat-header {
    padding: 14px 20px;
    border-bottom: 1px solid rgba(10,10,10,0.06);
    display: flex; align-items: center; gap: 12px;
    flex-shrink: 0;
  }
  .agent-back {
    width: 28px; height: 28px; border-radius: 9999px;
    background: rgba(10,10,10,0.04); border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background 0.15s;
  }
  .agent-back:hover { background: rgba(10,10,10,0.08); }
  .agent-chat-info { flex: 1; }
  .agent-chat-name { font-family: var(--font-body); font-weight: 600; font-size: 14px; color: var(--ink); }
  .agent-chat-meta {
    font-family: var(--font-body); font-size: 10px; color: var(--ink-30);
    display: flex; align-items: center; gap: 4px; margin-top: 1px;
  }
  .status-dot {
    width: 5px; height: 5px; border-radius: 9999px; display: inline-block;
  }
  .agent-chat-actions { display: flex; gap: 6px; }
  .agent-tag {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink);
    border: 1px solid rgba(10,10,10,0.1); border-radius: 9999px;
    padding: 4px 8px; cursor: pointer; background: none;
    transition: background 0.15s;
  }
  .agent-tag:hover { background: rgba(10,10,10,0.04); }
  .agent-chat-messages {
    flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px;
  }
  .agent-chat-composer {
    padding: 16px 20px; border-top: 1px solid rgba(10,10,10,0.06);
    background: #F7F6F2; display: flex; flex-direction: column; gap: 10px;
  }
  .agent-chat-composer .chips { padding: 0; }
  .agent-chat-input-row { display: flex; gap: 8px; align-items: center; }

  /* Inbox view */
  .inbox-view { padding: 24px 28px; }
  .inbox-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px;
  }
  .inbox-title {
    font-family: var(--font-display); font-weight: 700;
    font-size: 24px; letter-spacing: -0.02em; color: var(--ink);
  }
  .inbox-count {
    font-family: var(--font-mono); font-size: 10px; color: var(--ink-30);
    letter-spacing: 0.08em;
  }
  .inbox-list { display: flex; flex-direction: column; gap: 8px; }
  .inbox-item {
    background: #fff; border-radius: 14px;
    border: 1px solid rgba(10,10,10,0.06);
    padding: 16px 20px;
    display: flex; align-items: center; gap: 14px;
    transition: box-shadow 0.15s;
  }
  .inbox-item:hover {
    box-shadow: 0 4px 16px -4px rgba(10,10,10,0.08);
  }
  .inbox-item-text { flex: 1; }
  .inbox-item-title { font-family: var(--font-body); font-weight: 600; font-size: 13px; color: var(--ink); }
  .inbox-item-desc { font-family: var(--font-body); font-size: 11px; color: var(--ink-40); margin-top: 2px; }
  .inbox-item-time {
    font-family: var(--font-mono); font-size: 9px; color: var(--ink-30);
    flex-shrink: 0;
  }
  .inbox-item-actions { display: flex; gap: 6px; flex-shrink: 0; }

  /* Work view */
  .work-view { padding: 24px 28px; }
  .work-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px;
  }
  .work-title {
    font-family: var(--font-display); font-weight: 700;
    font-size: 24px; letter-spacing: -0.02em; color: var(--ink);
  }
  .work-filters { display: flex; gap: 6px; }
  .work-filter {
    font-family: var(--font-body); font-size: 11px; font-weight: 500;
    padding: 5px 14px; border-radius: 9999px; border: 1px solid rgba(10,10,10,0.1);
    background: #fff; color: var(--ink); cursor: pointer;
    transition: all 0.15s;
  }
  .work-filter.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .work-filter:not(.active):hover { background: rgba(10,10,10,0.03); }
  .work-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
  }
  .work-item {
    background: #fff; border-radius: 14px;
    border: 1px solid rgba(10,10,10,0.06);
    padding: 18px; cursor: pointer;
    transition: box-shadow 0.15s, transform 0.15s;
  }
  .work-item:hover {
    box-shadow: 0 4px 16px -4px rgba(10,10,10,0.08);
    transform: translateY(-1px);
  }
  .work-item-type {
    font-family: var(--font-mono); font-size: 8px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    padding: 2px 6px; border-radius: 9999px; display: inline-block;
    margin-bottom: 8px;
  }
  .work-item-title { font-family: var(--font-body); font-weight: 600; font-size: 13px; color: var(--ink); }
  .work-item-meta {
    display: flex; justify-content: space-between; align-items: center; margin-top: 8px;
  }
  .work-item-agent {
    font-family: var(--font-body); font-size: 10px; color: var(--ink-40);
    display: flex; align-items: center; gap: 4px;
  }
  .work-item-date { font-family: var(--font-mono); font-size: 9px; color: var(--ink-30); }
  .work-item-status {
    font-family: var(--font-mono); font-size: 8px; font-weight: 500;
    letter-spacing: 0.06em; text-transform: uppercase;
    padding: 2px 6px; border-radius: 9999px; margin-top: 8px; display: inline-block;
  }

  /* Search overlay */
  .search-overlay {
    position: fixed; inset: 0;
    background: rgba(10,10,10,0.5);
    backdrop-filter: blur(4px);
    z-index: 100;
    display: flex; align-items: flex-start; justify-content: center;
    padding-top: 15vh;
    animation: fadeIn 0.15s ease;
  }
  .search-overlay.hidden { display: none; }
  .search-box {
    background: #fff; border-radius: 16px;
    width: 540px; max-height: 420px;
    box-shadow: 0 24px 80px -12px rgba(10,10,10,0.3);
    overflow: hidden; display: flex; flex-direction: column;
    animation: searchIn 0.2s var(--ease);
  }
  .search-input-row {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 20px; border-bottom: 1px solid rgba(10,10,10,0.06);
  }
  .search-input {
    flex: 1; border: none; outline: none;
    font-family: var(--font-body); font-size: 15px; color: var(--ink);
    background: none;
  }
  .search-input::placeholder { color: var(--ink-30); }
  .search-kbd {
    font-family: var(--font-mono); font-size: 9px; color: var(--ink-30);
    background: rgba(10,10,10,0.04); padding: 2px 6px; border-radius: 4px;
  }
  .search-results {
    overflow-y: auto; max-height: 320px;
  }
  .search-section-title {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--ink-30);
    padding: 10px 20px 4px;
  }
  .search-result {
    padding: 10px 20px; display: flex; align-items: center; gap: 10px;
    cursor: pointer; transition: background 0.1s;
  }
  .search-result:hover, .search-result.focused { background: rgba(110,60,255,0.06); }
  .search-result-text { font-family: var(--font-body); font-size: 13px; color: var(--ink); }
  .search-result-sub { font-family: var(--font-body); font-size: 10px; color: var(--ink-40); }
  .search-empty {
    padding: 30px 20px; text-align: center;
    font-family: var(--font-body); font-size: 13px; color: var(--ink-30);
  }

  /* Toast */
  .toast-container {
    position: fixed; bottom: 24px; right: 24px; z-index: 200;
    display: flex; flex-direction: column; gap: 8px;
  }
  .toast {
    background: var(--ink); color: #fff;
    padding: 10px 18px; border-radius: 12px;
    font-family: var(--font-body); font-size: 12px; font-weight: 500;

function ghostSvg(color, size = 18) {
  return `<svg viewBox="0 0 200 200" fill="none" style="width:${size}px;height:${size}px;color:${color};flex-shrink:0"><path d="M 20 100 A 80 80 0 0 1 180 100 L 180 160 Q 160 182 140 160 Q 120 182 100 160 Q 80 182 60 160 Q 40 182 20 160 Z" fill="currentColor"/><ellipse cx="78" cy="92" rx="10" ry="15" fill="#0A0A0A"/><ellipse cx="122" cy="92" rx="10" ry="15" fill="#0A0A0A"/></svg>`;
}

function statusColor(status) {
  if (status === 'active') return '#00D26A';
  if (status === 'waiting') return '#FFD400';
  return 'var(--ink-20)';
}

function statusLabel(status) {
  if (status === 'active') return 'Actif';
  if (status === 'waiting') return 'En attente';
  return 'Inactif';
}

function getAgent(id) {
  return AGENTS.find(a => a.id === id);
}

function formatDate() {
  const d = new Date();
  const jours = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  const mois = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  const h = String(d.getHours()).padStart(2,'0');
  const m = String(d.getMinutes()).padStart(2,'0');
  return `${jours[d.getDay()]} ${d.getDate()} ${mois[d.getMonth()]} · ${h}:${m}`;
}

function activeAgentCount() {
  return AGENTS.filter(a => a.status === 'active').length;
}

function pendingCount() {
  return FEED.filter(f => f.status === 'waiting').length + INBOX_ITEMS.length;
}

function toast(text) {
  const el = document.createElement('div');
  el.className = 'toast toast-success';
  el.textContent = text;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => { el.classList.add('toast-out'); }, 2500);
  setTimeout(() => { el.remove(); }, 2800);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="app">
      ${renderSidebar()}
      <div class="main">
        ${renderTopbar()}
        ${renderMainContent()}
      </div>
    </div>
  `;
  bindEvents();
}

function renderSidebar() {
  const navItems = [
    { id: 'dashboard', label: 'Tableau de bord', icon: ICONS.dashboard },
    { id: 'inbox', label: 'Boîte de réception', icon: ICONS.inbox, badge: pendingCount() },
    { id: 'work', label: 'Travail produit', icon: ICONS.work },
  ];

  return `
    <div class="sidebar">
      <div class="ws">
        <div class="ws-avatar">${WORKSPACE.initials}</div>
        <div>
          <div class="ws-name">${WORKSPACE.name}</div>
          <div class="ws-sub">${WORKSPACE.type} &middot; ${WORKSPACE.city}</div>
        </div>
      </div>

      <div class="section-title">&mdash; Atelier</div>
      ${navItems.map(n => `
        <div class="nav-item ${STATE.view === n.id && !STATE.activeAgent ? 'active' : ''}" data-nav="${n.id}">
          ${n.icon}
          ${n.label}
          ${n.badge ? `<span class="nav-badge">${n.badge}</span>` : ''}
        </div>
      `).join('')}

      <div class="section-title" style="margin-top:14px">
        <span>&mdash; Agents actifs</span>
        <button class="add-agent-btn" data-action="add-agent">${ICONS.plus}</button>
      </div>

      ${AGENTS.map(a => `
        <div class="agent-row ${STATE.activeAgent === a.id ? 'active' : ''}" data-agent="${a.id}">
          ${ghostSvg(a.color)}
          ${a.name}
          <span class="agent-dot" style="background:${statusColor(a.status)}"></span>
          ${a.tasks > 0 ? `<span class="agent-count">${a.tasks}</span>` : ''}
        </div>
      `).join('')}

      <div class="support">
        ${ghostSvg('#FFD400', 44).replace('style="', 'style="position:absolute;right:-6px;bottom:-10px;opacity:0.9;')}
        <div class="support-title">Besoin d'aide ? On répond en 1h.</div>
        <div class="support-btn">Slack équipe →</div>
      </div>

      <div class="user-block">
        <div class="user-avatar">${USER.initials}</div>
        <div>
          <div class="user-name">${USER.name}</div>
          <div class="user-email">${USER.email}</div>
        </div>
      </div>
    </div>
  `;
}

function renderTopbar() {
  let breadcrumb = WORKSPACE.name;
  if (STATE.activeAgent) {
    const a = getAgent(STATE.activeAgent);
    breadcrumb += ` <span style="color:var(--ink-30)">/</span> <strong>${a.name}</strong>`;
  } else if (STATE.view === 'dashboard') {
    breadcrumb += ` <span style="color:var(--ink-30)">/</span> <strong>Tableau de bord</strong>`;
  } else if (STATE.view === 'inbox') {
    breadcrumb += ` <span style="color:var(--ink-30)">/</span> <strong>Boîte de réception</strong>`;
  } else if (STATE.view === 'work') {
    breadcrumb += ` <span style="color:var(--ink-30)">/</span> <strong>Travail produit</strong>`;
  }

  return `
    <div class="topbar">
      <div class="breadcrumb">${breadcrumb}</div>
      <div class="search-trigger" data-action="search">Cherche un agent, une tâche… ⌘K</div>
      <div class="topbar-right">
        <span class="tag-green">${activeAgentCount()} agents en cours</span>
        <button class="btn-dark" data-action="new-brief">Nouveau brief +</button>
      </div>
    </div>
  `;
}

function renderMainContent() {
  if (STATE.activeAgent) return renderAgentChat();
  if (STATE.view === 'inbox') return renderInbox();
  if (STATE.view === 'work') return renderWork();
  return renderDashboard();
}

function renderDashboard() {
  const filteredFeed = STATE.feedFilter === 'all' ? FEED : FEED.filter(f => f.status === 'waiting');
  const firstActiveAgent = AGENTS.find(a => a.status === 'active') || AGENTS[0];
  const composerAgent = firstActiveAgent;
  const convo = CONVERSATIONS[composerAgent.id] || [];

  return `
    <div class="content">
      <div class="welcome-row">
        <div>
          <div class="welcome-date">&mdash; ${formatDate()}</div>
          <div class="welcome-title">Salut ${USER.name.split(' ')[0]}. <span class="muted">Tes agents ont bien bossé.</span></div>
        </div>
        <div class="welcome-actions">
          <button class="btn-outline" data-action="report">Rapport mensuel ↗</button>
          <button class="btn-primary" data-action="new-brief">Brief un nouvel agent ✨</button>
        </div>
      </div>

      <div class="stats">
        ${STATS.map(s => `
          <div class="stat" style="background:${s.bg};color:${s.fg}">
            <div class="stat-label">&mdash; ${s.label}</div>
            <div class="stat-val">${s.value}</div>
            <div class="stat-sub">${s.sub}</div>
          </div>
        `).join('')}
      </div>

      <div class="two-col">
        <div class="card">
          <div class="card-header">
            <div>
              <div class="card-title">Activité agentique</div>
              <div class="card-sub">Tout ce qui s'est passé pendant que tu dormais.</div>
            </div>
            <div class="feed-filter-tabs">
              <button class="feed-filter-tab ${STATE.feedFilter === 'all' ? 'active-filter' : ''}" data-feed-filter="all">Tout</button>
              <button class="feed-filter-tab ${STATE.feedFilter === 'waiting' ? 'active-filter' : ''}" data-feed-filter="waiting">À valider · ${FEED.filter(f => f.status === 'waiting').length}</button>
            </div>
          </div>
          <div id="feed-list">
            ${filteredFeed.length === 0 ? `
              <div class="empty-state">
                <div class="empty-state-title">Tout est validé</div>
                <div class="empty-state-text">Aucun élément en attente de validation.</div>
              </div>
            ` : filteredFeed.map(f => {
              const a = getAgent(f.agent);
              return `
                <div class="feed-item" data-feed-agent="${f.agent}">
                  <span class="feed-time">${f.time}</span>
                  ${ghostSvg(a ? a.color : '#999', 22)}
                  <div class="feed-text"><strong>${f.title}</strong> ${f.text}<span class="sub">${f.sub}</span></div>
                  ${f.status === 'waiting' ? `
                    <div class="feed-actions">
                      <button class="feed-action-btn feed-action-approve" data-validate="${f.id}">Valider</button>
                      <button class="feed-action-btn feed-action-dismiss" data-dismiss="${f.id}">Ignorer</button>
                    </div>
                  ` : `
                    <span class="feed-status feed-done">Fait</span>
                  `}
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <div class="card" style="display:flex;flex-direction:column">
          <div class="card-header">
            <div style="display:flex;align-items:center;gap:10px">
              ${ghostSvg(composerAgent.color, 26)}
              <div>
                <div class="card-title">Agent ${composerAgent.name}</div>
                <div class="card-sub" style="display:flex;align-items:center;gap:4px">
                  <span class="status-dot" style="background:${statusColor(composerAgent.status)}"></span>
                  ${statusLabel(composerAgent.status)} · ${composerAgent.pilot} pilote
                </div>
              </div>
            </div>
            <button class="agent-tag" data-agent="${composerAgent.id}">Voir l'agent →</button>
          </div>

          <div class="messages" id="dashboard-messages">
            ${convo.map(m => `<div class="msg ${m.from === 'agent' ? 'msg-agent' : 'msg-user'}">${m.text}</div>`).join('')}
          </div>

          <div class="chips" id="dashboard-chips">
            ${(AGENT_CHIPS[composerAgent.id] || []).map(c => `<button class="chip" data-chip="${escapeHtml(c)}" data-chip-agent="${composerAgent.id}">${c}</button>`).join('')}

          <div class="composer-input">
            <input type="text" class="composer-field" id="dashboard-composer" placeholder="Dis ce que tu veux à ton agent…" data-agent="${composerAgent.id}" />
            <button class="send-btn" id="dashboard-send" data-agent="${composerAgent.id}">${ICONS.send}</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

  const mission = AGENT_MISSIONS[a.id] || { brief: '', since: '', completed: 0, successRate: 0 };

  const tabs = [
    { id: 'chat', label: 'Conversation' },
    { id: 'info', label: 'Mission & Stats' },
    { id: 'config', label: 'Paramètres' },
  ];

  let tabContent = '';
  if (STATE.agentTab === 'chat') {
    tabContent = `
      <div class="agent-chat-messages" id="agent-messages">
        ${convo.map(m => `<div class="msg ${m.from === 'agent' ? 'msg-agent' : 'msg-user'}">${m.text}</div>`).join('')}

      <div class="agent-chat-composer">
        <div class="chips" style="padding:0" id="agent-chips">

function renderInbox() {
  return `
    <div class="inbox-view">
      <div class="inbox-header">
        <div>
          <div class="inbox-title">Boîte de réception</div>
          <div class="inbox-count">${INBOX_ITEMS.length} éléments en attente</div>
        </div>
      </div>
      <div class="inbox-list">
        ${INBOX_ITEMS.length === 0 ? `
          <div class="empty-state">
            ${ghostSvg('#00D26A', 48)}
            <div class="empty-state-title">Tout est bon !</div>
            <div class="empty-state-text">Rien ne nécessite ton attention pour le moment.</div>
          </div>
        ` : INBOX_ITEMS.map(item => {
          const a = getAgent(item.agent);
          return `
            <div class="inbox-item">
              ${ghostSvg(a ? a.color : '#999', 28)}
              <div class="inbox-item-text">
                <div class="inbox-item-title">${item.title}</div>
                <div class="inbox-item-desc">${item.desc}</div>
              </div>
              <div class="inbox-item-time">${item.time}</div>
              <div class="inbox-item-actions">
                <button class="feed-action-btn feed-action-approve" data-inbox-approve="${item.id}">Valider</button>
                <button class="feed-action-btn feed-action-dismiss" data-inbox-dismiss="${item.id}">Ignorer</button>
                <button class="agent-tag" data-agent="${item.agent}">Voir l'agent →</button>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function renderWork() {
  const agents = [{ id: 'all', name: 'Tout' }, ...AGENTS.filter(a => WORK_ITEMS.some(w => w.agent === a.id))];
  const filtered = STATE.workFilter === 'all' ? WORK_ITEMS : WORK_ITEMS.filter(w => w.agent === STATE.workFilter);

  const statusStyle = (s) => {
    if (s === 'Publié' || s === 'Envoyé') return 'background: var(--green-100); color: var(--green-600)';
    if (s === 'En attente') return 'background: #FFE580; color: #6B5800';
    return 'background: rgba(10,10,10,0.04); color: var(--ink-40)';
  };

  return `
    <div class="work-view">
      <div class="work-header">
        <div class="work-title">Travail produit</div>
        <div class="work-filters">
          ${agents.map(a => `
            <button class="work-filter ${STATE.workFilter === a.id ? 'active' : ''}" data-work-filter="${a.id}">${a.name}</button>
          `).join('')}
        </div>
      </div>
      <div class="work-grid">
        ${filtered.map(w => {
          const a = getAgent(w.agent);
          return `
            <div class="work-item" data-agent="${w.agent}">
              <span class="work-item-type" style="background:${w.color}20;color:${w.color}">${w.type}</span>
              <div class="work-item-title">${w.title}</div>
              <div class="work-item-meta">
                <span class="work-item-agent">${ghostSvg(a ? a.color : '#999', 12)} ${a ? a.name : ''}</span>
                <span class="work-item-date">${w.date}</span>
              </div>
              <span class="work-item-status" style="${statusStyle(w.status)}">${w.status}</span>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function renderSearch() {
  const overlay = document.getElementById('search-overlay');
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <div class="search-box">
      <div class="search-input-row">
        ${ICONS.search}
        <input type="text" class="search-input" id="search-input" placeholder="Cherche un agent, une tâche, un contenu…" autofocus />
        <span class="search-kbd">ESC</span>
      </div>
      <div class="search-results" id="search-results">
        <div class="search-section-title">Agents</div>
        ${AGENTS.map(a => `
          <div class="search-result" data-search-agent="${a.id}">
            ${ghostSvg(a.color, 18)}
            <div>
              <div class="search-result-text">${a.name}</div>
              <div class="search-result-sub">${statusLabel(a.status)} · ${a.pilot} pilote</div>
            </div>
          </div>
        `).join('')}
        <div class="search-section-title">Vues</div>
        <div class="search-result" data-search-nav="dashboard">
          ${ICONS.dashboard}
          <div class="search-result-text">Tableau de bord</div>
        </div>
        <div class="search-result" data-search-nav="inbox">
          ${ICONS.inbox}
          <div class="search-result-text">Boîte de réception</div>
        </div>
        <div class="search-result" data-search-nav="work">
          ${ICONS.work}
          <div class="search-result-text">Travail produit</div>
        </div>
      </div>
    </div>
  `;

  const input = document.getElementById('search-input');
  input.focus();
  input.addEventListener('input', handleSearchInput);

  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeSearch();
  });

  overlay.querySelectorAll('[data-search-agent]').forEach(el => {
    el.addEventListener('click', () => {
      STATE.activeAgent = el.dataset.searchAgent;
      closeSearch();
      render();
    });
  });

  overlay.querySelectorAll('[data-search-nav]').forEach(el => {
    el.addEventListener('click', () => {
      STATE.view = el.dataset.searchNav;
      STATE.activeAgent = null;
      closeSearch();
      render();
    });
  });
}

function handleSearchInput(e) {
  const q = e.target.value.toLowerCase().trim();
  const results = document.getElementById('search-results');

  if (!q) {
    renderSearch();
    return;
  }

  const matchedAgents = AGENTS.filter(a => a.name.toLowerCase().includes(q));
  const matchedWork = WORK_ITEMS.filter(w => w.title.toLowerCase().includes(q) || w.type.toLowerCase().includes(q));
  const matchedFeed = FEED.filter(f => f.text.toLowerCase().includes(q) || f.title.toLowerCase().includes(q));

  let html = '';

  if (matchedAgents.length) {
    html += '<div class="search-section-title">Agents</div>';
    html += matchedAgents.map(a => `
      <div class="search-result" data-search-agent="${a.id}">
        ${ghostSvg(a.color, 18)}
        <div>
          <div class="search-result-text">${a.name}</div>
          <div class="search-result-sub">${statusLabel(a.status)} · ${a.pilot} pilote</div>
        </div>
      </div>
    `).join('');
  }

  if (matchedWork.length) {
    html += '<div class="search-section-title">Travail produit</div>';
    html += matchedWork.map(w => `
      <div class="search-result" data-search-agent="${w.agent}">
        <div>
          <div class="search-result-text">${w.title}</div>
          <div class="search-result-sub">${w.type} · ${w.date}</div>
        </div>
      </div>
    `).join('');
  }

  if (matchedFeed.length) {
    html += '<div class="search-section-title">Activité</div>';
    html += matchedFeed.map(f => `
      <div class="search-result" data-search-agent="${f.agent}">
        <div>
          <div class="search-result-text">${f.title} ${f.text}</div>
          <div class="search-result-sub">${f.time}</div>
        </div>
      </div>
    `).join('');
  }

  if (!html) {
    html = '<div class="search-empty">Aucun résultat pour « ' + escapeHtml(q) + ' »</div>';
  }

  results.innerHTML = html;

  results.querySelectorAll('[data-search-agent]').forEach(el => {
    el.addEventListener('click', () => {
      STATE.activeAgent = el.dataset.searchAgent;
      closeSearch();
      render();
    });
  });
}

function closeSearch() {
  document.getElementById('search-overlay').classList.add('hidden');
  STATE.searchOpen = false;
}


// ═══════════════════════════════════════════════════════════
//  MODALS
// ═══════════════════════════════════════════════════════════

function openModal(html) {
  const overlay = document.getElementById('modal-overlay');
  overlay.classList.remove('hidden');
  overlay.innerHTML = `<div class="modal">${html}</div>`;
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeModal();
  });
  const closeBtn = overlay.querySelector('[data-action="close-modal"]');
  if (closeBtn) closeBtn.addEventListener('click', closeModal);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
}

function openBriefModal() {
  openModal(`
    <div class="modal-header">
      <span class="modal-title">Nouveau brief agent</span>
      <button class="modal-close" data-action="close-modal">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Nom de l'agent</label>
        <input type="text" class="form-input" id="brief-name" placeholder="Ex : Community Manager, Comptable, Deviseur…" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Pôle</label>
          <select class="form-select" id="brief-pole">
            ${POLES.map(p => `<option value="${p}">${p}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Pilote</label>
          <select class="form-select" id="brief-pilot">
            ${PILOTS.map(p => `<option value="${p}">${p}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Brief / Mission</label>
        <textarea class="form-textarea" id="brief-mission" placeholder="Décris ce que cet agent doit faire, ses objectifs, son périmètre…"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Couleur</label>
        <div class="color-picker" id="color-picker">
          ${RAINBOW_COLORS.map(c => `
            <div class="color-swatch ${STATE.selectedColor === c ? 'selected' : ''}" style="background:${c}" data-color="${c}"></div>
          `).join('')}
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-outline" data-action="close-modal">Annuler</button>
      <button class="btn-primary" id="brief-submit">Créer l'agent ✦</button>
    </div>
  `);

  // Color picker
  document.querySelectorAll('#color-picker .color-swatch').forEach(el => {
    el.addEventListener('click', () => {
      STATE.selectedColor = el.dataset.color;
      document.querySelectorAll('#color-picker .color-swatch').forEach(s => s.classList.remove('selected'));
      el.classList.add('selected');
    });
  });

  // Submit
  document.getElementById('brief-submit').addEventListener('click', () => {
    const name = document.getElementById('brief-name').value.trim();
    if (!name) { toast('Donne un nom à ton agent'); return; }

    const mission = document.getElementById('brief-mission').value.trim();
    const pilot = document.getElementById('brief-pilot').value;
    const pole = document.getElementById('brief-pole').value;
    const id = name.toLowerCase().replace(/[^a-z0-9]/g, '_').slice(0, 20) + '_' + Date.now();

    AGENTS.push({
      id, name, color: STATE.selectedColor, status: 'active', tasks: 0, pilot,
    });

    AGENT_MISSIONS[id] = {
      brief: mission || `Agent ${name} — ${pole}`,
      since: new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }),
      completed: 0, successRate: 0,
    };

    CONVERSATIONS[id] = [
      { from: 'agent', text: `Bonjour ! Je suis ${name}, ton nouvel agent ${pole}. Dis-moi ce que tu attends de moi et je me mets au travail.` },
    ];

    AGENT_RESPONSES[id] = [
      'Compris. Je me lance tout de suite.',
      'Bien reçu. Je prépare ça et je te tiens au courant.',
      'OK, je m\'en occupe. Tu auras un premier retour dans l\'heure.',
    ];

    AGENT_CHIPS[id] = ['Commence maintenant', 'Montre-moi un plan', 'Attends mon signal', 'Plus de détails'];

    closeModal();
    STATE.activeAgent = id;
    STATE.agentTab = 'chat';
    render();
    toast(`Agent "${name}" créé !`);
  });

  // Cancel buttons
  document.querySelectorAll('[data-action="close-modal"]').forEach(el => {
    el.addEventListener('click', closeModal);
  });
}

  const totalTasks = Object.values(AGENT_MISSIONS).reduce((s, m) => s + m.completed, 0);
  const avgSuccess = Math.round(Object.values(AGENT_MISSIONS).reduce((s, m) => s + m.successRate, 0) / Object.keys(AGENT_MISSIONS).length);

  openModal(`
    <div class="modal-header">
      <span class="modal-title">Rapport mensuel — Mai 2025</span>
      <button class="modal-close" data-action="close-modal">✕</button>
    </div>
    <div class="modal-body">
      <div class="report-grid">
        <div class="report-card">
          <div class="report-card-value">${totalTasks}</div>
          <div class="report-card-label">Tâches terminées</div>
        </div>
        <div class="report-card">
          <div class="report-card-value">${avgSuccess}%</div>
          <div class="report-card-label">Taux de succès moyen</div>
        </div>
        <div class="report-card">
          <div class="report-card-value">${activeAgentCount()}</div>
          <div class="report-card-label">Agents actifs</div>
        </div>
        <div class="report-card">
          <div class="report-card-value">€2.4k</div>
          <div class="report-card-label">Valeur estimée</div>
        </div>
      </div>

      <div class="report-section-title">Performance par agent</div>
      ${AGENTS.map(a => {
        const m = AGENT_MISSIONS[a.id] || { completed: 0, successRate: 0 };
        return `
          <div class="report-row">
            <span class="report-row-agent">${ghostSvg(a.color, 14)} ${a.name}</span>
            <div class="report-bar"><div class="report-bar-fill" style="width:${m.successRate}%;background:${a.color};border-radius:2px"></div></div>
            <span class="report-row-value">${m.completed} tâches · ${m.successRate}%</span>
          </div>
        `;
      }).join('')}

      <div class="report-section-title">KPIs business</div>
      ${STATS.map(s => `
        <div class="report-row">
          <span class="report-row-agent">${s.label}</span>
          <span class="report-row-value">${s.value}</span>
        </div>
      `).join('')}
    </div>
    <div class="modal-footer">
      <button class="btn-outline" data-action="close-modal">Fermer</button>
      <button class="btn-primary" onclick="toast('Export PDF — bientôt disponible');closeModal()">Exporter PDF ↗</button>
    </div>
  `);

  document.querySelectorAll('[data-action="close-modal"]').forEach(el => {
    el.addEventListener('click', closeModal);
  });
}

function openEditBriefModal() {
  const a = getAgent(STATE.activeAgent);
  if (!a) return;
  const m = AGENT_MISSIONS[a.id] || { brief: '' };

  openModal(`
    <div class="modal-header">
      <span class="modal-title">Modifier le brief — ${a.name}</span>
      <button class="modal-close" data-action="close-modal">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Nom</label>
        <input type="text" class="form-input" id="edit-name" value="${escapeHtml(a.name)}" />
      </div>
      <div class="form-group">
        <label class="form-label">Brief / Mission</label>
        <textarea class="form-textarea" id="edit-mission" style="min-height:120px">${escapeHtml(m.brief)}</textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Pilote</label>
          <select class="form-select" id="edit-pilot">
            ${PILOTS.map(p => `<option value="${p}" ${a.pilot === p ? 'selected' : ''}>${p}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Couleur</label>
          <div class="color-picker" id="edit-color-picker">
            ${RAINBOW_COLORS.map(c => `
              <div class="color-swatch ${a.color === c ? 'selected' : ''}" style="background:${c}" data-color="${c}"></div>
            `).join('')}
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-outline" data-action="close-modal">Annuler</button>
      <button class="btn-primary" id="edit-submit">Enregistrer</button>
    </div>
  `);

  let editColor = a.color;
  document.querySelectorAll('#edit-color-picker .color-swatch').forEach(el => {
    el.addEventListener('click', () => {
      editColor = el.dataset.color;
      document.querySelectorAll('#edit-color-picker .color-swatch').forEach(s => s.classList.remove('selected'));
      el.classList.add('selected');
    });
  });

  document.getElementById('edit-submit').addEventListener('click', () => {
    const name = document.getElementById('edit-name').value.trim();
    if (!name) { toast('Le nom ne peut pas être vide'); return; }
    a.name = name;
    a.pilot = document.getElementById('edit-pilot').value;
    a.color = editColor;
    const missionText = document.getElementById('edit-mission').value.trim();
    if (AGENT_MISSIONS[a.id]) AGENT_MISSIONS[a.id].brief = missionText;
    closeModal();
    render();
    toast('Brief mis à jour');
  });

  document.querySelectorAll('[data-action="close-modal"]').forEach(el => {
    el.addEventListener('click', closeModal);
  });
}


// ═══════════════════════════════════════════════════════════
//  BACKGROUND ACTIVITY
// ═══════════════════════════════════════════════════════════

function simulateActivity() {
  const event = BACKGROUND_EVENTS[backgroundEventIndex % BACKGROUND_EVENTS.length];
  backgroundEventIndex++;
  feedCounter++;

  const now = new Date();
  const time = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

  FEED.unshift({
    id: 'f' + feedCounter,
    time,
    agent: event.agent,
    title: event.title,
    text: event.text,
    sub: event.sub,
    status: Math.random() > 0.6 ? 'waiting' : 'done',
  });

  if (FEED.length > 20) FEED.pop();

  if (STATE.view === 'dashboard' && !STATE.activeAgent) {
    render();
  }

  const a = getAgent(event.agent);
  toast(`${event.title} ${event.text.slice(0, 40)}…`);
}


// ═══════════════════════════════════════════════════════════
//  MESSAGING
// ═══════════════════════════════════════════════════════════

function sendMessage(agentId, text) {
  if (!text.trim()) return;

  const convo = CONVERSATIONS[agentId] || [];
  convo.push({ from: 'user', text: text.trim() });
  CONVERSATIONS[agentId] = convo;

  render();
  scrollMessages();

  setTimeout(() => {
    showTyping(agentId);
  }, 400);

  setTimeout(() => {
    const responses = AGENT_RESPONSES[agentId] || ['Compris. Je m’en occupe.'];
    const response = responses[Math.floor(Math.random() * responses.length)];
    convo.push({ from: 'agent', text: response });
    render();
    scrollMessages();
  }, 1500 + Math.random() * 1000);
}

function showTyping(agentId) {
  const container = STATE.activeAgent
    ? document.getElementById('agent-messages')
    : document.getElementById('dashboard-messages');

  if (!container) return;

  const existing = container.querySelector('.typing');
  if (existing) return;

  const div = document.createElement('div');
  div.className = 'typing';
  div.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
  container.appendChild(div);
  scrollMessages();
}

function scrollMessages() {
  requestAnimationFrame(() => {
    const container = STATE.activeAgent
      ? document.getElementById('agent-messages')
      : document.getElementById('dashboard-messages');
    if (container) container.scrollTop = container.scrollHeight;
  });
}


// ═══════════════════════════════════════════════════════════
//  EVENTS
// ═══════════════════════════════════════════════════════════

function bindEvents() {
  // Nav items
  document.querySelectorAll('[data-nav]').forEach(el => {
    el.addEventListener('click', () => {
      STATE.view = el.dataset.nav;
      STATE.activeAgent = null;
      render();
    });
  });

  // Agent rows
  document.querySelectorAll('[data-agent]').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('[data-validate]') || e.target.closest('[data-dismiss]') ||
          e.target.closest('[data-inbox-approve]') || e.target.closest('[data-inbox-dismiss]')) return;
      STATE.activeAgent = el.dataset.agent;
      render();
      scrollMessages();
    });
  });

  // Feed filters
  document.querySelectorAll('[data-feed-filter]').forEach(el => {
    el.addEventListener('click', () => {
      STATE.feedFilter = el.dataset.feedFilter;
      render();
    });
  });

  // Feed validate
  document.querySelectorAll('[data-validate]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = el.dataset.validate;
      const item = FEED.find(f => f.id === id);
      if (item) {
        item.status = 'done';
        toast('Validé !');
        render();
      }
    });
  });

  // Feed dismiss
  document.querySelectorAll('[data-dismiss]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = el.dataset.dismiss;
      FEED = FEED.filter(f => f.id !== id);
      toast('Élément ignoré');
      render();
    });
  });

  // Inbox approve
  document.querySelectorAll('[data-inbox-approve]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = el.dataset.inboxApprove;
      const idx = INBOX_ITEMS.findIndex(i => i.id === id);
      if (idx !== -1) {
        INBOX_ITEMS.splice(idx, 1);
        toast('Validé !');
        render();
      }
    });
  });

  // Inbox dismiss
  document.querySelectorAll('[data-inbox-dismiss]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = el.dataset.inboxDismiss;
      const idx = INBOX_ITEMS.findIndex(i => i.id === id);
      if (idx !== -1) {
        INBOX_ITEMS.splice(idx, 1);
        toast('Élément ignoré');
        render();
      }
    });
  });

  // Work filters
  document.querySelectorAll('[data-work-filter]').forEach(el => {
    el.addEventListener('click', () => {
      STATE.workFilter = el.dataset.workFilter;
      render();
    });
  });

  // Search trigger
  document.querySelectorAll('[data-action="search"]').forEach(el => {
    el.addEventListener('click', () => {
      STATE.searchOpen = true;
      renderSearch();
    });
  });

  // Back button
  document.querySelectorAll('[data-action="back"]').forEach(el => {
    el.addEventListener('click', () => {
      STATE.activeAgent = null;
      STATE.agentTab = 'chat';
      render();
    });
  });

  // New brief
  document.querySelectorAll(‘[data-action="new-brief"]’).forEach(el => {
    el.addEventListener(‘click’, () => openBriefModal());
  });

  // Report
  document.querySelectorAll(‘[data-action="report"]’).forEach(el => {
    el.addEventListener(‘click’, () => openReportModal());
  });

  // Add agent
  document.querySelectorAll(‘[data-action="add-agent"]’).forEach(el => {
    el.addEventListener(‘click’, () => openBriefModal());
  });

  // Agent pause
  document.querySelectorAll(‘[data-action="agent-pause"]’).forEach(el => {
    el.addEventListener(‘click’, () => {
      const a = getAgent(STATE.activeAgent);
      if (a) {
        a.status = a.status === ‘active’ ? ‘idle’ : ‘active’;
        toast(a.status === ‘active’ ? `${a.name} réactivé` : `${a.name} mis en pause`);
        render();
      }
    });
  });

  // Edit brief
  document.querySelectorAll(‘[data-action="agent-edit-brief"]’).forEach(el => {
    el.addEventListener(‘click’, () => openEditBriefModal());
  });

  // Agent tabs
  document.querySelectorAll(‘[data-agent-tab]’).forEach(el => {
    el.addEventListener(‘click’, () => {
      STATE.agentTab = el.dataset.agentTab;
      render();
      if (STATE.agentTab === ‘chat’) scrollMessages();
    });
  });

  // Toggle switches in config
  document.querySelectorAll(‘[data-action="toggle-agent"]’).forEach(el => {
    el.addEventListener(‘click’, () => {
      const a = getAgent(STATE.activeAgent);
      if (a) {
        a.status = a.status === ‘active’ ? ‘idle’ : ‘active’;
        toast(a.status === ‘active’ ? `${a.name} réactivé` : `${a.name} mis en pause`);
        render();
      }
    });
  });

  document.querySelectorAll(‘[data-action="toggle-notif"], [data-action="toggle-auto"]’).forEach(el => {
    el.addEventListener(‘click’, () => {
      el.classList.toggle(‘on’);
      toast(‘Paramètre mis à jour’);
    });
  });

  // Delete agent
  document.querySelectorAll(‘[data-action="delete-agent"]’).forEach(el => {
    el.addEventListener(‘click’, () => {
      const a = getAgent(STATE.activeAgent);
      if (a && confirm(`Supprimer l’agent "${a.name}" ?`)) {
        const idx = AGENTS.findIndex(ag => ag.id === a.id);
        if (idx !== -1) AGENTS.splice(idx, 1);
        STATE.activeAgent = null;
        STATE.agentTab = ‘chat’;
        render();
        toast(`Agent "${a.name}" supprimé`);
      }
    });
  });

  // Chips
  document.querySelectorAll('[data-chip]').forEach(el => {
    el.addEventListener('click', () => {
      const text = el.dataset.chip;
      const agentId = el.dataset.chipAgent;
      sendMessage(agentId, text);
    });
  });

  // Composer inputs
  const dashInput = document.getElementById('dashboard-composer');
  const dashSend = document.getElementById('dashboard-send');
  if (dashInput && dashSend) {
    dashInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage(dashInput.dataset.agent, dashInput.value);
      }
    });
    dashSend.addEventListener('click', () => {
      sendMessage(dashInput.dataset.agent, dashInput.value);
    });
  }

  const agentInput = document.getElementById('agent-composer');
  const agentSend = document.getElementById('agent-send');
  if (agentInput && agentSend) {
    agentInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage(agentInput.dataset.agent, agentInput.value);
      }
    });
    agentSend.addEventListener('click', () => {
      sendMessage(agentInput.dataset.agent, agentInput.value);
    });
    agentInput.focus();
  }

  // Feed item click -> open agent
  document.querySelectorAll('[data-feed-agent]').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('.feed-action-btn') || e.target.closest('.feed-status')) return;
      STATE.activeAgent = el.dataset.feedAgent;
      render();
      scrollMessages();
    });
  });
}

// Global keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    if (STATE.searchOpen) {
      closeSearch();
    } else {
      STATE.searchOpen = true;
      renderSearch();
    }
  }
  if (e.key === 'Escape') {
    if (!document.getElementById('modal-overlay').classList.contains('hidden')) {
      closeModal();
    } else if (STATE.searchOpen) {
      closeSearch();
    } else if (STATE.activeAgent) {
      STATE.activeAgent = null;
      STATE.agentTab = 'chat';
      render();
    }
  }
});


// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════

render();

// Background activity every 45-90 seconds
setInterval(simulateActivity, 45000 + Math.random() * 45000);
</script>
