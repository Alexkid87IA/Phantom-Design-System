<style>
:root {
  --violet: #6E3CFF;
  --violet-50: #F2EDFF;
  --violet-200: #C5ADFF;
  --pink: #FF2D87;
  --orange: #FF8A1F;
  --yellow: #FFD400;
  --green: #00D26A;
  --blue: #0066FF;
  --red: #FF4D2E;
  --ink: #0A0A0A;
  --font-display: 'Space Grotesk', system-ui, sans-serif;
  --font-body: 'Geist', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font-body);
  background: var(--ink);
  color: #fff;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--yellow); color: var(--ink); }

/* ── LAYOUT ── */
.app {
  height: 100%; display: flex; flex-direction: column;
  max-width: 800px; margin: 0 auto;
  position: relative;
}

/* ── TOPBAR ── */
.topbar {
  padding: 20px 24px;
  display: flex; align-items: center; gap: 14px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  flex-shrink: 0;
  background: rgba(10,10,10,0.95);
  backdrop-filter: blur(20px);
  z-index: 10;
}
.topbar-ghost {
  width: 40px; height: 40px; flex-shrink: 0;
  animation: ghostFloat 2.4s ease-in-out infinite;
}
@keyframes ghostFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}
.topbar-info { flex: 1; }
.topbar-name {
  font-family: var(--font-display); font-weight: 700;
  font-size: 16px; letter-spacing: -0.02em;
}
.topbar-status {
  font-size: 12px; color: rgba(255,255,255,0.4);
  display: flex; align-items: center; gap: 6px; margin-top: 2px;
}
.topbar-dot {
  width: 6px; height: 6px; border-radius: 9999px;
  background: var(--green);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.topbar-tag {
  font-family: var(--font-mono); font-size: 9px;
  letter-spacing: 0.1em; text-transform: uppercase;
  padding: 4px 10px; border-radius: 9999px;
  background: rgba(110,60,255,0.15); color: var(--violet-200);
}

/* ── CHAT ── */
.chat {
  flex: 1; overflow-y: auto; padding: 24px 24px 16px;
  display: flex; flex-direction: column; gap: 6px;
  scroll-behavior: smooth;
}
.chat::-webkit-scrollbar { width: 4px; }
.chat::-webkit-scrollbar-track { background: transparent; }
.chat::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

/* ── MESSAGES ── */
.msg {
  max-width: 85%; opacity: 0; transform: translateY(10px);
  animation: msgIn 0.35s var(--ease) forwards;
}
@keyframes msgIn {
  to { opacity: 1; transform: translateY(0); }
}
.msg--agent { align-self: flex-start; }
.msg--user { align-self: flex-end; }

.msg-bubble {
  padding: 14px 18px;
  border-radius: 20px;
  font-size: 15px; line-height: 1.5;
}
.msg--agent .msg-bubble {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  border-bottom-left-radius: 6px;
  color: rgba(255,255,255,0.85);
}
.msg--user .msg-bubble {
  background: var(--violet);
  border-bottom-right-radius: 6px;
  color: #fff;
}
.msg-bubble strong { color: #fff; font-weight: 600; }
.msg-bubble em { font-style: normal; color: var(--yellow); }

/* ── TYPING INDICATOR ── */
.typing {
  align-self: flex-start;
  display: flex; gap: 5px; padding: 16px 20px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px; border-bottom-left-radius: 6px;
}
.typing-dot {
  width: 7px; height: 7px; border-radius: 9999px;
  background: rgba(255,255,255,0.3);
  animation: typingBounce 1.2s ease-in-out infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.15s; }
.typing-dot:nth-child(3) { animation-delay: 0.3s; }
@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
  30% { transform: translateY(-6px); opacity: 1; }
}

/* ── RICH CARDS (inside messages) ── */
.rich-card {
  margin-top: 12px; padding: 16px;
  background: rgba(255,255,255,0.04);
  border: 1.5px solid rgba(255,255,255,0.1);
  border-radius: 14px;
}
.rich-card + .rich-card { margin-top: 8px; }
.rich-card-title {
  font-family: var(--font-display); font-weight: 700;
  font-size: 15px; letter-spacing: -0.01em;
}
.rich-card-desc {
  font-size: 13px; color: rgba(255,255,255,0.4);
  margin-top: 4px; line-height: 1.45;
}
.rich-card-tag {
  display: inline-block; font-family: var(--font-mono);
  font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 9999px;
  margin-top: 8px;
}

/* ── STAT ROW (inside messages) ── */
.stat-row {
  display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap;
}
.stat-block {
  flex: 1; min-width: 80px; padding: 12px;
  background: rgba(255,255,255,0.04);
  border: 1.5px solid rgba(255,255,255,0.1);
  border-radius: 12px; text-align: center;
}
.stat-block-val {
  font-family: var(--font-display); font-weight: 700;
  font-size: 22px; letter-spacing: -0.03em;
}
.stat-block-label {
  font-family: var(--font-mono); font-size: 8px;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: rgba(255,255,255,0.3); margin-top: 4px;
}

/* ── QUICK REPLIES ── */
.replies {
  flex-shrink: 0;
  padding: 12px 24px 24px;
  display: flex; gap: 8px; flex-wrap: wrap;
  justify-content: center;
  opacity: 0; transform: translateY(10px);
  animation: msgIn 0.4s var(--ease) 0.2s forwards;
}
.reply-btn {
  font-family: var(--font-body); font-size: 14px; font-weight: 600;
  padding: 12px 20px; border-radius: 14px;
  border: 2.5px solid rgba(255,255,255,0.12);
  background: transparent; color: #fff;
  cursor: pointer;
  transition: all 0.2s var(--ease);
  white-space: nowrap;
}
.reply-btn:hover {
  border-color: var(--violet);
  background: rgba(110,60,255,0.1);
  transform: translateY(-2px);
}
.reply-btn--primary {
  background: var(--yellow); color: var(--ink);
  border-color: var(--ink); box-shadow: 4px 4px 0 0 var(--ink);
}
.reply-btn--primary:hover {
  transform: translate(-2px, -2px);
  box-shadow: 6px 6px 0 0 var(--ink);
  background: var(--yellow);
}

/* ── BG GHOST ── */
.bg-ghost {
  position: fixed; pointer-events: none; z-index: 0;
  opacity: 0.015;
}
@keyframes ghostRainbow {
  0%   { color: #FF2D87; }
  16%  { color: #FF8A1F; }
  33%  { color: #FFD400; }
  50%  { color: #00D26A; }
  66%  { color: #0066FF; }
  83%  { color: #6E3CFF; }
  100% { color: #FF2D87; }
}

/* ── RESPONSIVE ── */
@media (max-width: 600px) {
  .app { max-width: 100%; }
  .topbar { padding: 16px; }
  .chat { padding: 16px; }
  .replies { padding: 12px 16px 20px; }
  .reply-btn { font-size: 13px; padding: 10px 16px; }
}
</style>

// ── Helpers ──

function wait(ms) {
  return new Promise(function(r) { setTimeout(r, ms); });
}

function scrollToBottom() {
  chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
}

function showTyping() {
  typingEl = document.createElement('div');
  typingEl.className = 'typing';
  typingEl.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
  chat.appendChild(typingEl);
  scrollToBottom();
}

function hideTyping() {
  if (typingEl && typingEl.parentNode) {
    typingEl.parentNode.removeChild(typingEl);
    typingEl = null;
  }
}

function addMessage(html, type) {
  hideTyping();
  var msg = document.createElement('div');
  msg.className = 'msg msg--' + type;
  msg.innerHTML = '<div class="msg-bubble">' + html + '</div>';
  chat.appendChild(msg);
  scrollToBottom();
}

function agentSays(html, delay) {
  return new Promise(function(resolve) {
    showTyping();
    setTimeout(function() {
      addMessage(html, 'agent');
      resolve();
    }, delay || 1200);
  });
}

function userSays(text) {
  addMessage(text, 'user');
}

function showReplies(options) {
  return new Promise(function(resolve) {
    repliesContainer.innerHTML = '';
    repliesContainer.className = 'replies';
    options.forEach(function(opt) {
      var btn = document.createElement('button');
      btn.className = 'reply-btn' + (opt.primary ? ' reply-btn--primary' : '');
      btn.textContent = opt.label;
      btn.addEventListener('click', function() {
        repliesContainer.innerHTML = '';
        repliesContainer.className = '';
        userSays(opt.label);
        resolve(opt.value || opt.label);
      });
      repliesContainer.appendChild(btn);
    });
    scrollToBottom();
  });
}

// ── Conversation flow ──

async function runConversation() {

  await wait(800);
  await agentSays('Salut. 👋', 800);
  await wait(400);
  await agentSays('Je suis l\'agent <strong>Phantom</strong>. Je produis du contenu à échelle industrielle — articles, vidéos, carrousels, podcasts, newsletters, sites, apps, brand — pour n\'importe quelle industrie.', 1800);
  await wait(600);
  await agentSays('Des <strong>humains</strong> décident la stratégie. Des <strong>agents IA</strong> exécutent. Des <strong>humains</strong> valident tout avant publication.', 1500);
  await wait(500);
  await agentSays('Tu es dans quelle industrie ?', 800);

  var industry = await showReplies([
    { label: 'Média', value: 'Média' },
    { label: 'Restaurant', value: 'Restaurant' },
    { label: 'E-commerce', value: 'E-commerce' },
    { label: 'SaaS / Tech', value: 'SaaS / Tech' },
    { label: 'Immobilier', value: 'Immobilier' },
    { label: 'Santé', value: 'Santé' },
  ]);

  await wait(400);
  var data = industries[industry];

  await agentSays(industry + ' — parfait. Voilà ce que je sais faire pour toi :', 1200);
  await wait(300);

  var cardsHtml = '';
  data.tasks.forEach(function(t) {
    cardsHtml += '<div class="rich-card">';
    cardsHtml += '<div class="rich-card-title">' + t.title + '</div>';
    cardsHtml += '<div class="rich-card-desc">' + t.desc + '</div>';
    cardsHtml += '<div class="rich-card-tag" style="background:' + t.tagColor + '20;color:' + t.tagColor + '">' + t.tag + '</div>';
    cardsHtml += '</div>';
  });
  await agentSays(cardsHtml, 2000);
  await wait(600);

  await agentSays('Tu veux voir des résultats concrets ?', 800);

  var seeProof = await showReplies([
    { label: 'Montre-moi les chiffres', value: 'stats' },
    { label: 'Je veux parler à un humain', value: 'human', primary: true },
  ]);

  if (seeProof === 'stats') {
    await wait(400);

    var statsHtml = '<div class="stat-row">';
    data.stats.forEach(function(s) {
      statsHtml += '<div class="stat-block">';
      statsHtml += '<div class="stat-block-val" style="color:' + s.color + '">' + s.val + '</div>';
      statsHtml += '<div class="stat-block-label">' + s.label + '</div>';
      statsHtml += '</div>';
    });
    statsHtml += '</div>';
    await agentSays('Voilà ce qu\'on a déjà prouvé :' + statsHtml, 1500);
    await wait(500);

    await agentSays(data.outro, 1200);
    await wait(400);
    await agentSays('On se parle ? 20 minutes, zéro engagement. Tu décides après.', 1000);

    await showReplies([
      { label: 'Prendre un échange →', value: 'call', primary: true },
      { label: 'Voir l\'offre TPE / PME', value: 'tpe' },
      { label: 'Recommencer', value: 'restart' },
    ]);
  }

  if (seeProof === 'human' || seeProof === 'call') {
    await wait(400);
    await agentSays('Parfait. <strong>Alex Quilghini</strong> va prendre le relais.<br><br><span style="color:rgba(255,255,255,0.4)">alex@origines.media</span><br><br><a href="#" style="display:inline-block;margin-top:8px;padding:12px 24px;background:var(--yellow);color:var(--ink);border-radius:12px;font-weight:700;text-decoration:none;border:2.5px solid var(--ink);box-shadow:4px 4px 0 0 var(--ink)">Réserver 20 min →</a>', 1200);
    return;
  }

  if (seeProof === 'tpe') {
    await wait(300);
    await agentSays('Je t\'envoie vers notre page TPE / PME. À tout de suite.', 800);
    await wait(800);
    window.location.href = 'index.html';
    return;
  }

  if (seeProof === 'restart') {
    chat.innerHTML = '';
    repliesContainer.innerHTML = '';
    repliesContainer.className = '';
    await runConversation();
    return;
  }
}

runConversation();

})();
</script>
